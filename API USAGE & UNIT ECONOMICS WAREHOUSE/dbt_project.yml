name: 'nexora_usage_economics'
version: '1.0.0'
config-version: 2
profile: 'nexora_usage_economics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
docs-paths: ["docs"]

target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]
require-dbt-version: [">=1.7.0", "<2.0.0"]

seeds:
  nexora_usage_economics:
    +schema: raw
    +quote_columns: false
    +delimiter: ','

models:
  nexora_usage_economics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    dimensions:
      +schema: analytics
      +materialized: table
    facts:
      +schema: analytics
      +materialized: incremental
      +incremental_strategy: delete+insert
    marts:
      +schema: analytics
      +materialized: table
