<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" role="img">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#4d6a99"/></marker></defs>
<rect width="1180" height="620" fill="#0b1220"/>
<rect x="0" y="0" width="1180" height="4" fill="#34d399"/>
<text x="40" y="52" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e7edf7" text-anchor="start" letter-spacing="0.3">Event processing &amp; incremental recovery</text>
<text x="40" y="76" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">NEXORA API  ·  USAGE &amp;amp; UNIT ECONOMICS WAREHOUSE  ·  event time vs business time</text>
<rect x="40" y="128" width="178" height="118" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="52" y="152" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="0.5">1  DELIVER</text>
<text x="52" y="176" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">source_event_id</text>
<text x="52" y="192" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">+ payload_hash</text>
<line x1="218" y1="187.0" x2="225" y2="187.0" stroke="#3f5a86" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="226" y="128" width="178" height="118" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="238" y="152" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0.5">2  DEDUPE</text>
<text x="238" y="176" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">same id + hash → duplicate</text>
<text x="238" y="192" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">same id + new hash → quarantine</text>
<line x1="404" y1="187.0" x2="411" y2="187.0" stroke="#3f5a86" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="412" y="128" width="178" height="118" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="424" y="152" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="0.5">3  VERSION</text>
<text x="424" y="176" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">highest entity_version</text>
<text x="424" y="192" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">wins per entity</text>
<line x1="590" y1="187.0" x2="597" y2="187.0" stroke="#3f5a86" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="598" y="128" width="178" height="118" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="610" y="152" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="0.5">4  EFFECTIVE DATE</text>
<text x="610" y="176" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">plan @ request_created_at</text>
<text x="610" y="192" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">price @ request_created_at</text>
<text x="610" y="208" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">cost @ attempt_started_at</text>
<line x1="776" y1="187.0" x2="783" y2="187.0" stroke="#3f5a86" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="784" y="128" width="178" height="118" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="796" y="152" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="0.5">5  FACTS</text>
<text x="796" y="176" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">one row per entity</text>
<text x="796" y="192" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">billing × component</text>
<text x="796" y="208" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">cost × terminal attempt</text>
<line x1="962" y1="187.0" x2="969" y2="187.0" stroke="#3f5a86" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="970" y="128" width="178" height="118" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="982" y="152" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="0.5">6  MARTS</text>
<text x="982" y="176" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">independent reduction</text>
<text x="982" y="192" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">before any join</text>
<rect x="40" y="286" width="1100" height="96" rx="10" fill="#101a2b" stroke="#24405f" stroke-width="1.2" opacity="1"/>
<text x="58" y="312" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="0.7">SEVEN-DAY EVENT-TIME WINDOW</text>
<text x="58" y="336" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">incremental run selects entity ids whose event_timestamp ≥ current_timestamp − 7 days,</text>
<text x="58" y="356" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">then re-reads ALL versions for those ids and replaces one row per entity  →  a late-arriving correction to a June request is still picked up in November</text>
<rect x="966" y="304" width="150" height="22" rx="11" fill="#1d2b44"/>
<text x="1041" y="319" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="0">unique_key = entity id</text>
<rect x="40" y="404" width="356" height="74" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="58" y="428" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0.6">OUTSIDE THE WINDOW</text>
<text x="58" y="450" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.1" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">row is kept in raw + flagged backfill_required.</text>
<text x="58" y="468" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.1" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">Recovery = controlled full refresh, not deletion.</text>
<rect x="412" y="404" width="356" height="74" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="430" y="428" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0.6">QUARANTINE</text>
<text x="430" y="450" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.1" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">invalid payload preserved with error codes;</text>
<text x="430" y="468" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.1" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">never silently dropped, never counted as zero.</text>
<rect x="784" y="404" width="356" height="74" rx="10" fill="#131c2e" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="802" y="428" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="0.6">CORRECTION</text>
<text x="802" y="450" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.1" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">new version appended; raw history untouched;</text>
<text x="802" y="468" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.1" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">facts replaced on the entity key, not appended.</text>
<rect x="40" y="498" width="1100" height="84" rx="10" fill="#0d1626" stroke="#2a3a58" stroke-width="1.2" opacity="1"/>
<text x="58" y="522" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="700" fill="#38bdf8" text-anchor="start" letter-spacing="0.6">WHY THIS MATTERS</text>
<text x="58" y="546" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">A retried request produces several provider attempts but must be billed once. Revenue is reduced from fct_billing_line (1 request × component);</text>
<text x="58" y="566" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="400" fill="#93a4bf" text-anchor="start" letter-spacing="0">cost is reduced from fct_provider_cost_line (1 terminal attempt × component). Both are aggregated to the daily key before they meet — no fanout possible.</text>
</svg>